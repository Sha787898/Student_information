<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Information Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #170d24 100%);
      min-height: 100vh;
    }
    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="text-slate-100 p-3 md:p-8 flex flex-col justify-between items-center min-h-screen">

  <!-- Navigation Bar -->
  <nav class="w-full max-w-lg flex justify-between items-center p-3 mb-4 glass rounded-2xl text-xs">
    <span class="font-bold text-indigo-400 flex items-center gap-2">
      <i class="fa-solid fa-graduation-cap"></i> AH College Portal
    </span>
    <a href="admin.html" class="px-3 py-1.5 bg-indigo-500/10 hover:bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 rounded-xl transition flex items-center gap-1.5 font-medium">
      <i class="fa-solid fa-user-shield text-[10px]"></i> Admin Login
    </a>
  </nav>

  <!-- Form Container -->
  <div class="w-full max-w-lg p-6 md:p-8 glass rounded-3xl shadow-2xl my-auto">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-extrabold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">স্টুডেন্ট তথ্য ফর্ম</h2>
      <p class="text-slate-400 text-xs mt-1">Govt. Azizul Haque College</p>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="hidden p-3.5 mb-5 rounded-2xl text-xs font-semibold"></div>

    <form id="studentForm" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">পূর্ণ নাম</label>
        <input type="text" id="name" required placeholder="আপনার নাম লিখুন" class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-xs text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">রোল নম্বর</label>
        <input type="number" id="roll" required placeholder="আপনার রোল লিখুন" class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-xs text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">গ্রুপ নির্বাচন করুন</label>
        <select id="group" required class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-xs text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">গ্রুপ বেছে নিন</option>
          <option value="A">Group A (Roll 1-30)</option>
          <option value="B">Group B (Roll 31-60)</option>
          <option value="C">Group C (Roll 61-90)</option>
          <option value="D">Group D (Roll 91-120)</option>
          <option value="E">Group E (Roll 121-150)</option>
          <option value="F">Group F (Roll 151-180)</option>
          <option value="G">Group G (Roll 181-210)</option>
          <option value="H">Group H (Roll 211-240)</option>
          <option value="I">Group I (Roll 241-270)</option>
          <option value="J">Group J (Roll 271+)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">বিষয় (Department)</label>
        <input type="text" id="subject" required placeholder="যেমন: Accounting, Physics" class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-xs text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">মোবাইল নম্বর</label>
        <input type="tel" id="phone" required placeholder="017xxxxxxxx" class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-xs text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <button type="submit" id="submitBtn" class="w-full py-3.5 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-xl text-xs transition active:scale-95 shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2">
        <span>তথ্য জমা দিন</span> <i class="fa-solid fa-paper-plane text-xs"></i>
      </button>
    </form>
  </div>

  <footer class="mt-6 text-slate-500 text-[11px] text-center">
    &copy; Shabid • All Rights Reserved
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    function getCorrectGroup(roll) {
      if (roll >= 1 && roll <= 30) return 'A';
      if (roll >= 31 && roll <= 60) return 'B';
      if (roll >= 61 && roll <= 90) return 'C';
      if (roll >= 91 && roll <= 120) return 'D';
      if (roll >= 121 && roll <= 150) return 'E';
      if (roll >= 151 && roll <= 180) return 'F';
      if (roll >= 181 && roll <= 210) return 'G';
      if (roll >= 211 && roll <= 240) return 'H';
      if (roll >= 241 && roll <= 270) return 'I';
      if (roll >= 271) return 'J';
      return null;
    }

    const form = document.getElementById('studentForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      const roll = parseInt(document.getElementById('roll').value);
      const subject = document.getElementById('subject').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const selectedGroup = document.getElementById('group').value;

      const correctGroup = getCorrectGroup(roll);

      if (!correctGroup) {
        showAlert('দয়া করে সঠিক রোল নাম্বার প্রদান করুন।', 'error');
        return;
      }

      if (selectedGroup !== correctGroup) {
        showAlert(`ভুল গ্রুপ সিলেক্ট করেছেন! আপনার রোল (${roll}) অনুযায়ী সঠিক গ্রুপ হলো: Group ${correctGroup}।`, 'warning');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'জমা হচ্ছে...';

      try {
        const { data, error } = await _supabase
          .from('student_info')
          .insert([{ name, roll, subject, phone, assigned_group: selectedGroup }]);

        if (error) {
          showAlert(`ত্রুটি: ${error.message || 'তথ্য জমা দেওয়া সম্ভব হয়নি।'}`, 'error');
        } else {
          showAlert('ধন্যবাদ! আপনার তথ্য সফলভাবে জমা হয়েছে।', 'success');
          form.reset();
        }
      } catch (err) {
        showAlert('সার্ভারে কানেক্ট করতে সমস্যা হচ্ছে।', 'error');
      }

      submitBtn.disabled = false;
      submitBtn.innerHTML = `<span>তথ্য জমা দিন</span> <i class="fa-solid fa-paper-plane text-xs"></i>`;
    });

    function showAlert(msg, type) {
      alertBox.classList.remove('hidden', 'bg-red-500/20', 'text-red-300', 'border-red-500/40', 'bg-yellow-500/20', 'text-yellow-300', 'border-yellow-500/40', 'bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500/40');
      alertBox.classList.add('border');

      if (type === 'error') {
        alertBox.classList.add('bg-red-500/20', 'text-red-300', 'border-red-500/40');
      } else if (type === 'warning') {
        alertBox.classList.add('bg-yellow-500/20', 'text-yellow-300', 'border-yellow-500/40');
      } else {
        alertBox.classList.add('bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500/40');
      }

      alertBox.innerText = msg;
    }
  </script>
</body>
</html>
