<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shabid • Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #0b0f19; }
  </style>
</head>
<body class="text-slate-100 p-4 md:p-8">

  <!-- Password Authentication Screen -->
  <div id="loginScreen" class="max-w-md mx-auto my-20 p-8 bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl text-center">
    <div class="w-16 h-16 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h2 class="text-2xl font-bold mb-2">Shabid Admin Login</h2>
    <p class="text-slate-400 text-xs mb-6">সকল স্টুডেন্টের তথ্য দেখার জন্য পাসওয়ার্ড দিন</p>
    
    <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড লিখুন" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl mb-4 text-center outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
    <button onclick="checkAdminPassword()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 rounded-xl font-semibold transition">লগইন করুন</button>
    <p id="loginError" class="text-red-400 text-xs mt-3 hidden">ভুল পাসওয়ার্ড!</p>
  </div>

  <!-- Dashboard Screen (Hidden by default) -->
  <div id="dashboard" class="max-w-6xl mx-auto hidden">
    <header class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8 pb-4 border-b border-slate-800">
      <div>
        <h1 class="text-2xl font-bold">Admin Dashboard</h1>
        <p class="text-slate-400 text-xs">Govt. Azizul Haque College • Student Submissions</p>
      </div>
      <button onclick="fetchData()" class="px-4 py-2 bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 rounded-xl text-xs font-semibold hover:bg-indigo-600/40 transition flex items-center gap-2">
        <i class="fa-solid fa-rotate-right"></i> রিফ্রেশ ডাটা
      </button>
    </header>

    <div class="overflow-x-auto bg-slate-900 border border-slate-800 rounded-2xl shadow-xl">
      <table class="w-full text-left border-collapse text-xs md:text-sm">
        <thead>
          <tr class="border-b border-slate-800 bg-slate-800/50 text-slate-400">
            <th class="p-4">#</th>
            <th class="p-4">নাম</th>
            <th class="p-4">রোল</th>
            <th class="p-4">গ্রুপ</th>
            <th class="p-4">বিষয়</th>
            <th class="p-4">মোবাইল নম্বর</th>
            <th class="p-4">তারিখ ও সময়</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="divide-y divide-slate-800/50 text-slate-300">
          <!-- JS dynamic row inserting -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // এখানে তোমার গোপন পাসওয়ার্ড দিয়ে দাও
    const SECRET_PASSWORD = "12345"; // <-- এখানে তোমার পছন্দের পাসওয়ার্ড পরিবর্তন করো

    function checkAdminPassword() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === SECRET_PASSWORD) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        fetchData();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    async function fetchData() {
      const { data, error } = await _supabase
        .from('student_info')
        .select('*')
        .order('roll', { ascending: true });

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (error || !data.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-500">কোনো ডাটা পাওয়া যায়নি।</td></tr>`;
        return;
      }

      data.forEach((student, idx) => {
        const row = `
          <tr class="hover:bg-slate-800/30 transition">
            <td class="p-4 font-mono text-slate-500">${idx + 1}</td>
            <td class="p-4 font-semibold text-slate-100">${student.name}</td>
            <td class="p-4 font-mono text-indigo-400 font-bold">${student.roll}</td>
            <td class="p-4"><span class="px-2.5 py-1 rounded-md bg-purple-500/10 border border-purple-500/30 text-purple-300 font-bold">Group ${student.assigned_group}</span></td>
            <td class="p-4">${student.subject}</td>
            <td class="p-4 font-mono">${student.phone}</td>
            <td class="p-4 text-slate-500 text-xs">${new Date(student.created_at).toLocaleString('bn-BD')}</td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }
  </script>
</body>
</html>
